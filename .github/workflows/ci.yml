name: CI
on:
  push:
    branches: [main]

jobs:
  test:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run generator tests
        run: python3 -m unittest discover -s tests/generator -p "test_*.py" -v

      - name: Generate test containers
        run: python3 cvx_generator.py --config tests/config.json --compiler gcc

      - name: Compile tests
        run: mkdir -p bin && gcc -g -Wall -Wextra -I . -I tests/includes tests/tests.c tests/src/*.c -o bin/tests

      - name: Run tests
        run: ./bin/tests

      - name: Install valgrind (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y valgrind

      - name: Run tests with valgrind (Linux only)
        if: runner.os == 'Linux'
        run: valgrind --leak-check=full --error-exitcode=1 ./bin/tests

  docs:
    name: Docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Generate headers for docs
        run: python3 cvx_generator.py --config docs/config.json --compiler gcc

      - name: Generate docs
        run: doxygen docs/Doxyfile

      - name: Deploy to documentation branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/output/html
          publish_branch: documentation
          cname: cvx.leoven.dev

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gcovr
        run: pip install gcovr

      - name: Generate test containers
        run: python3 cvx_generator.py --config tests/config.json --compiler gcc

      - name: Compile with coverage instrumentation
        run: mkdir -p bin && gcc -g -O0 --coverage -Wall -Wextra -I . -I tests/includes tests/tests.c tests/src/*.c -o bin/tests_cov

      - name: Run tests
        run: ./bin/tests_cov

      - name: Generate coverage report
        run: mkdir -p coverage && gcovr --root . --filter 'tests/src/' --html-details coverage/index.html --print-summary

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
